<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Pets na clinica veterinaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
</body>
</html>

    <!-- Bootstrap CSS (opcional, mas ajuda a deixar o design mais bonito) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">

    <h1 class="text-center mt-5"> Gerenciamento de Pets em uma Clinica Veterinaria</h1>

    <div class="mt-4">
        <form id="postitForm">
            <div class="mb-3">
                <label for="titulo" class="form-label">Nome Do Pet</label>
                <input type="text" class="form-control" id="titulo" placeholder="Digite o Nome Do Pet " required>
            </div>
            </div>
            <div class="mb-3">
                <label for="imagem" class="form-label">Selecione uma Imagem</label>
                <input type="file" class="form-control" id="imagem" accept="image/*" required>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" rows="3" placeholder="Digite a descrição" required></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Adicionar Post-It</button>
        </form>
    </div>

    <h2 class="mt-5">Meus Pacientes</h2>
    <div id="postitsContainer" class="d-flex flex-wrap justify-content-start">
        <!-- Post-its vão aparecer aqui -->
    </div>

    <!-- Bootstrap JS (opcional, mas útil para interações rápidas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Link para o arquivo externo de JavaScript -->
    <script src="script.js"></script>

</body>
</html>
